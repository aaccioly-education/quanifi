{% extends "base.html" %}
{% block title %}Sign in · Quanifi{% endblock %}
{% block content %}
<section class="card">
  <h1>Sign in</h1>
  {% if form.errors %}<p>Invalid email or password.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <p><label>Email<br><input name="username" autocomplete="username" required></label></p>
    <p><label>Password<br><input name="password" type="password" autocomplete="current-password" required></label></p>
    <input type="hidden" name="next" value="{{ next }}">
    <button type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
